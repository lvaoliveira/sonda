name: Pull request scan

# sonda on a pull request's own code, on GitHub's runner, saved for
# pr-upload.yml to send to the maintainer's server (ADR-0028). No secrets
# and no self-hosted runner: a pull request's author decides what this runs,
# which is why self-analysis.yml never runs on one.
on:
  pull_request:

permissions: {}

concurrency:
  group: pr-scan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # The Rust and web app tests' coverage, as self-analysis.yml has it on
  # main. One artifact from the repository's root, so each report lands in
  # the scan's checkout where it was written.
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-rust
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-llvm-cov
      - run: cargo llvm-cov --workspace --all-targets --locked --lcov --output-path lcov.info
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Even when the Rust tests fail: the web app's report still counts.
      - if: ${{ !cancelled() }}
        working-directory: web
        run: corepack enable && pnpm install --frozen-lockfile && pnpm test:coverage
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            lcov.info
            web/coverage/lcov.info
          if-no-files-found: warn
          retention-days: 1

  # After the tests, failed or not: without a report, the decoration says
  # coverage has no data and why.
  scan:
    needs: coverage
    if: ${{ !cancelled() }}
    permissions:
      contents: read
    uses: ./.github/workflows/scan-pull-request.yml
    with:
      project: sonda
      # The CLI from this pull request, so it analyzes itself, as main does.
      sonda-version: source
      coverage-artifact: coverage
      coverage: lcov.info web/coverage/lcov.info
