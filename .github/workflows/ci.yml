name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: no job needs to write anything. Do not switch to
# `pull_request_target`: PR code must never run with a privileged token.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# Third-party actions are pinned to full commit SHAs (tag in the comment);
# Dependabot proposes updates.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Bump when Cargo.toml's profiles change: the key hashes the
          # dependencies, not the profiles, so a stale build would be restored
          # and rebuilt on every run, never saved again.
          prefix-key: v1-rust
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # Libraries only: the CLI's doc comments are clap help text, not rustdoc.
      - run: cargo doc --workspace --lib --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Rules doc is up to date
        run: cargo run -q --locked -p sonda -- rules --format markdown | diff - docs/rules.md
      # The fuzz crate is a separate workspace; keep it compiling between
      # the weekly fuzz runs (fuzz.yml).
      - run: cargo fmt --manifest-path fuzz/Cargo.toml -- --check
      - run: cargo clippy --manifest-path fuzz/Cargo.toml --locked -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Bump when Cargo.toml's profiles change: the key hashes the
          # dependencies, not the profiles, so a stale build would be restored
          # and rebuilt on every run, never saved again.
          prefix-key: v1-rust
      - run: cargo test --workspace --all-targets --all-features --locked
      # --all-targets skips doctests; the library's examples must compile too.
      - run: cargo test --workspace --doc --locked

  # Each crate's own rust-version: the CLI and core library stay at 1.90;
  # the server needs 1.94 (sqlx 0.9) and ships as a Docker image anyway.
  msrv:
    strategy:
      fail-fast: false
      matrix:
        include:
          - toolchain: "1.90" # rust-version in the root Cargo.toml
            packages: -p sonda -p sonda-core
          - toolchain: "1.94" # rust-version in crates/sonda-server/Cargo.toml
            packages: -p sonda-server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Bump when Cargo.toml's profiles change: the key hashes the
          # dependencies, not the profiles, so a stale build would be restored
          # and rebuilt on every run, never saved again.
          prefix-key: v1-rust
      - run: cargo check ${{ matrix.packages }} --all-targets --locked

  # The server's database tests, against real PostgreSQL. Elsewhere they
  # skip; here SONDA_REQUIRE_DB_TESTS turns a missing database into a failure.
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        # 15 is the oldest supported version (ADR-0005); compose.yaml runs 17.
        image: postgres:15@sha256:64b99032e218b66b1d1a6334995056e1aa57f50a0c522cc856e72dff0e4b0d63
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      SONDA_TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres
      SONDA_REQUIRE_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Bump when Cargo.toml's profiles change: the key hashes the
          # dependencies, not the profiles, so a stale build would be restored
          # and rebuilt on every run, never saved again.
          prefix-key: v1-rust
      - run: cargo test -p sonda-server --all-targets --locked

  # The compatibility window (docs/stability.md): the last published
  # release's CLI uploads to the server built from this change. It is the
  # promise that a pipeline can keep its pinned CLI while the server upgrades.
  compat:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15@sha256:64b99032e218b66b1d1a6334995056e1aa57f50a0c522cc856e72dff0e4b0d63
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-rust
      - run: cargo build -p sonda-server --locked
      - name: The last release's CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo "$GITHUB_REPOSITORY" --pattern 'sonda-*-x86_64-linux' --dir "$RUNNER_TEMP/old"
          gh release download --repo "$GITHUB_REPOSITORY" --pattern 'SHA256SUMS' --dir "$RUNNER_TEMP/old"
          cd "$RUNNER_TEMP/old"
          sha256sum -c --ignore-missing SHA256SUMS
          chmod +x sonda-*-x86_64-linux
      - name: It uploads to this server
        env:
          DATABASE_URL: postgres://postgres:test@localhost:5432/postgres
        run: scripts/check-compat.sh "$RUNNER_TEMP"/old/sonda-*-x86_64-linux target/debug/sonda-server

  # Safe upgrades (docs/release-1.0.md, M2): the last release's server fills a
  # database, the server built from this change takes it over, and
  # everything is still there and served. The release publishes the CLI only
  # (the server image comes with M3), so the old server is built from its tag.
  upgrade:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15@sha256:64b99032e218b66b1d1a6334995056e1aa57f50a0c522cc856e72dff0e4b0d63
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The last release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)" >> "$GITHUB_OUTPUT"
          gh release download --repo "$GITHUB_REPOSITORY" --pattern 'sonda-*-x86_64-linux' --pattern SHA256SUMS --dir "$RUNNER_TEMP/old"
          cd "$RUNNER_TEMP/old"
          sha256sum -c --ignore-missing SHA256SUMS
          chmod +x sonda-*-x86_64-linux
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag }}
          path: old
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-rust
          workspaces: |
            . -> target
            old -> target
      - run: cargo build -p sonda-server --locked
      - run: cargo build -p sonda-server --locked --manifest-path old/Cargo.toml
      - name: The old server's database upgrades
        env:
          DATABASE_URL: postgres://postgres:test@localhost:5432/postgres
        run: scripts/check-upgrade.sh old/target/debug/sonda-server target/debug/sonda-server "$RUNNER_TEMP"/old/sonda-*-x86_64-linux

  # ADR-0005's acceptance check: the documented one command on a clean
  # machine gives a working server.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # With the LAN address and HTTPS too, so both are checked on a clean
      # machine.
      - run: scripts/setup-server.sh --lan --https 127.0.0.1
      - name: Health, web app and API routing
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:9000/api/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:9000/api/health | grep -q '"ok"'
          curl -fsS http://127.0.0.1:9000/issues | grep -qi '<!doctype html>'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9000/api/nope)" = 404
      - name: Sign-in over plain HTTP on the LAN address
        run: |
          lan=$(sed -n 's/^SONDA_LAN_ADDRESS=//p' .env)
          jq -n --rawfile p secrets/admin_password '{username: "admin", password: ($p | rtrimstr("\n"))}' > /tmp/sign-in.json
          curl -fsS -D - -o /dev/null -H 'Content-Type: application/json' \
            --data @/tmp/sign-in.json "http://$lan:9000/api/session" > /tmp/headers
          grep -qi '^set-cookie: sonda_session=' /tmp/headers
          if grep -i '^set-cookie:' /tmp/headers | grep -qi secure; then
            echo "the session cookie is Secure, so browsers drop it over HTTP"
            exit 1
          fi
      - name: HTTPS, trusting Caddy's root
        run: curl -fsS --cacert caddy-root.crt https://127.0.0.1:9443/api/health | grep -q '"ok"'
      - name: Logs
        if: always()
        run: docker compose logs
      - if: always()
        run: docker compose down -v

  # The CLI for hosts without Rust: the image's `cli` target, installed.
  docker-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck scripts/*.sh
      - run: scripts/install-cli.sh
      # Every language parses in the sandbox; strace names a call it misses.
      - run: sudo apt-get install -y -qq strace > /dev/null
      - run: scripts/check-languages.sh

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-deny,cargo-audit
      # Advisories, licenses, banned crates and allowed sources (deny.toml).
      - run: cargo deny --locked check
      # Overlaps with deny's advisory check, but uses RustSec's reference tool.
      - run: cargo audit --deny warnings

  # Reported, not gated, so it runs on main only: on pull requests it was a
  # fourth full run of the test suite, instrumented, that nobody read.
  coverage:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Bump when Cargo.toml's profiles change: the key hashes the
          # dependencies, not the profiles, so a stale build would be restored
          # and rebuilt on every run, never saved again.
          prefix-key: v1-rust
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-llvm-cov
      # Reported, not gated: coverage is for finding gaps, not a target.
      - run: cargo llvm-cov --workspace --all-targets --locked --lcov --output-path lcov.info
      - run: cargo llvm-cov report --locked --summary-only
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: lcov.info

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # pnpm comes from package.json's packageManager field; installs honor
      # pnpm-workspace.yaml's 14-day minimumReleaseAge.
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --audit-level low
