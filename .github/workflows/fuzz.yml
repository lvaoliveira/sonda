name: Fuzz

on:
  schedule:
    - cron: "17 3 * * 1" # weekly, Monday 03:17 UTC
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds to fuzz each target
        default: "1200"
  pull_request:
    paths: ["fuzz/**", "crates/sonda-core/**", "Cargo.lock"]

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [analyze, config, lockfile]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-fuzz
      - name: Fuzz
        env:
          # Instrument the C grammars too: AddressSanitizer catches memory
          # errors in them, and coverage guides the fuzzer through them.
          CC: clang
          CFLAGS: -fsanitize=address -fsanitize-coverage=inline-8bit-counters,pc-table -fno-omit-frame-pointer
          TARGET: ${{ matrix.target }}
          SECONDS_PER_TARGET: ${{ github.event_name == 'pull_request' && '60' || inputs.seconds || '1200' }}
        run: |
          [[ "$SECONDS_PER_TARGET" =~ ^[0-9]+$ ]] || { echo "seconds must be a number"; exit 1; }
          mkdir -p "fuzz/corpus/$TARGET"
          # Explicit target: the prebuilt cargo-fuzz is a musl binary and would
          # otherwise default to the musl target, which has no sanitizers.
          host="$(rustc -vV | sed -n 's/^host: //p')"
          cargo fuzz run --target "$host" "$TARGET" "fuzz/corpus/$TARGET" "fuzz/seeds/$TARGET" -- \
            -max_total_time="$SECONDS_PER_TARGET" -timeout=20 -rss_limit_mb=4096 -max_len=65536
      - name: Keep the crashing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
