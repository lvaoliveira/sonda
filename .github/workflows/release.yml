name: Release

# A `v*` tag publishes a GitHub Release (docs/release-1.0.md, M0): the CLI as
# static Linux binaries from the image's `cli` target, built on each
# architecture's own runner, and as macOS (Apple Silicon) and Windows
# (x86_64) binaries built natively with the same Rust, each checked to parse
# every language in its sandbox and to report the tag's version, with
# SHA-256 checksums; the notes are the tag's CHANGELOG section. The release
# stays a draft until every binary is attached, so a failed build never
# publishes half a release. A macOS job that never gets a runner (GitHub's
# are often short) fails the same way: rerun it.
#
# The server image goes to GHCR as ghcr.io/<owner>/sonda:<version>, one build
# per architecture on its own runner, merged into one multi-arch tag once
# both run (`--version`), and its digest is added to the release notes: that
# is what the docs tell people to pin.
#
# Every binary and the image get a build provenance attestation and an SBOM
# (CycloneDX, written by the binary just built, from the lockfiles the
# artifact was built from), attested too and attached to the release. SECURITY.md
# says how to verify them.
#
# scripts/install.sh is attached too, with the release's version filled in,
# attested and in SHA256SUMS; once published, it's tried on each platform.
#
# A pull request that changes what a release is made of runs the same
# builds and checks, without creating or publishing anything.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - Dockerfile
      - scripts/install-cli.sh
      - scripts/install.sh
      - scripts/check-languages.sh

permissions: {}

# One release per tag at a time.
concurrency:
  group: release-${{ github.ref_name }}

jobs:
  draft:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tag is Cargo.toml's version and has changelog notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          # A release candidate, v0.2.0-rc.1, is 0.2.0's, from the same
          # commit and notes, published as a pre-release: everything a
          # release does, run for real, while CI's "last release" (compat,
          # upgrade) stays the last one, since GitHub's latest skips
          # pre-releases.
          base=${version%-rc.*}
          extra=()
          [ "$base" = "$version" ] || extra+=(--prerelease)
          if ! grep -qx "version = \"$base\"" Cargo.toml; then
            echo "::error::the tag is $GITHUB_REF_NAME, but Cargo.toml's version isn't $base"
            exit 1
          fi
          awk -v v="$base" '/^## \[/ { p = index($0, "## [" v "]") == 1; next } p' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no section for $base"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "sonda $version" --notes-file "$RUNNER_TEMP/notes.md" "${extra[@]}"

  cli:
    needs: draft
    # On a pull request `draft` is skipped, and the builds still run.
    if: ${{ !failure() && !cancelled() }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/install-cli.sh "$RUNNER_TEMP/bin"
      - run: sudo apt-get install -y -qq strace > /dev/null
      - run: scripts/check-languages.sh "$RUNNER_TEMP/bin/sonda"
      - name: It reports the version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if ! "$RUNNER_TEMP/bin/sonda" --version | grep -qw -- "$version"; then
            echo "::error::the binary doesn't report version $version"
            exit 1
          fi
      # What the binary was built from: the workspace's locked crates. Also on
      # a pull request, so a change that breaks it is seen before a tag.
      - name: It writes its SBOM
        run: |
          mkdir "$RUNNER_TEMP/locks"
          cp Cargo.lock "$RUNNER_TEMP/locks/"
          "$RUNNER_TEMP/bin/sonda" sbom "$RUNNER_TEMP/locks" --output "$RUNNER_TEMP/sbom.cdx.json"
          # attest-sbom takes a CycloneDX BOM only with a serial number.
          jq -e '.bomFormat == "CycloneDX" and (.serialNumber | type == "string") and (.components | length) > 100' "$RUNNER_TEMP/sbom.cdx.json" > /dev/null
      - name: Name it
        if: github.event_name == 'push'
        id: files
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          version=${GITHUB_REF_NAME#v}
          name="sonda-$version-$ARCH-linux"
          cp "$RUNNER_TEMP/bin/sonda" "$RUNNER_TEMP/$name"
          mv "$RUNNER_TEMP/sbom.cdx.json" "$RUNNER_TEMP/$name.cdx.json"
          echo "path=$RUNNER_TEMP/$name" >> "$GITHUB_OUTPUT"
      - name: Attest where it was built
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.files.outputs.path }}
      - name: Attest its SBOM
        if: github.event_name == 'push'
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: ${{ steps.files.outputs.path }}
          sbom-path: ${{ steps.files.outputs.path }}.cdx.json
      - name: Attach it, with its checksums
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.files.outputs.path }}
        run: |
          cd "$RUNNER_TEMP"
          name=$(basename "$NAME")
          sha256sum "$name" > "$name.sha256"
          sha256sum "$name.cdx.json" > "$name.cdx.json.sha256"
          gh release upload "$GITHUB_REF_NAME" "$name" "$name.sha256" "$name.cdx.json" "$name.cdx.json.sha256" --repo "$GITHUB_REPOSITORY"

  # The CLI on macOS (Apple Silicon) and Windows (x86_64): built on their own
  # runners with the Rust the Linux binaries use, checked the same way, and
  # named, attested and attached like them.
  cli-native:
    needs: draft
    if: ${{ !failure() && !cancelled() }}
    strategy:
      matrix:
        include:
          - runner: macos-latest
            platform: aarch64-macos
            exe: ""
          - runner: windows-latest
            platform: x86_64-windows
            exe: .exe
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      EXE: ${{ matrix.exe }}
      # Windows: the C runtime linked in, so the binary needs no Visual C++
      # redistributable installed.
      RUSTFLAGS: ${{ matrix.exe == '.exe' && '-C target-feature=+crt-static' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build it with the Linux binaries' Rust
        run: |
          # The Dockerfile's cli-build stage pins it; Dependabot keeps it current.
          rust=$(sed -n 's/^FROM rust:\([0-9.]*\)-alpine.*/\1/p' Dockerfile)
          rustup toolchain install "$rust" --profile minimal --no-self-update
          cargo "+$rust" build --release --locked -p sonda
          # A Unix-style path, which check-languages.sh needs on Windows too.
          bin="$(cd "$RUNNER_TEMP" && pwd)/bin"
          mkdir -p "$bin"
          cp "target/release/sonda$EXE" "$bin/"
          echo "SONDA=$bin/sonda$EXE" >> "$GITHUB_ENV"
      - run: scripts/check-languages.sh "$SONDA"
      # check-languages.sh takes the sandbox on trust where it can't start;
      # macOS has one, so the shipped binary must start it.
      - name: Its sandbox starts
        if: runner.os == 'macOS'
        run: '"$SONDA" scan scripts --sandbox require --no-gate -o /dev/null'
      - name: It reports the version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if ! "$SONDA" --version | grep -qw -- "$version"; then
            echo "::error::the binary doesn't report version $version"
            exit 1
          fi
      - name: It writes its SBOM
        run: |
          mkdir "$RUNNER_TEMP/locks"
          cp Cargo.lock "$RUNNER_TEMP/locks/"
          "$SONDA" sbom "$RUNNER_TEMP/locks" --output "$RUNNER_TEMP/sbom.cdx.json"
          # attest-sbom takes a CycloneDX BOM only with a serial number.
          jq -e '.bomFormat == "CycloneDX" and (.serialNumber | type == "string") and (.components | length) > 100' "$RUNNER_TEMP/sbom.cdx.json" > /dev/null
      - name: Name it
        if: github.event_name == 'push'
        id: files
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          version=${GITHUB_REF_NAME#v}
          base="sonda-$version-$PLATFORM"
          cp "$SONDA" "$RUNNER_TEMP/$base$EXE"
          mv "$RUNNER_TEMP/sbom.cdx.json" "$RUNNER_TEMP/$base.cdx.json"
          echo "path=$RUNNER_TEMP/$base$EXE" >> "$GITHUB_OUTPUT"
          echo "sbom=$RUNNER_TEMP/$base.cdx.json" >> "$GITHUB_OUTPUT"
      - name: Attest where it was built
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.files.outputs.path }}
      - name: Attest its SBOM
        if: github.event_name == 'push'
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: ${{ steps.files.outputs.path }}
          sbom-path: ${{ steps.files.outputs.sbom }}
      - name: Attach it, with its checksums
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.files.outputs.path }}
          SBOM: ${{ steps.files.outputs.sbom }}
        run: |
          cd "$RUNNER_TEMP"
          # Written by hand: Windows' sha256sum marks binary files with `*`,
          # and SHA256SUMS keeps the Linux lines' two-space form.
          sum() { printf '%s  %s\n' "$(sha256sum < "$1" | cut -d' ' -f1)" "$1"; }
          name=$(basename "$NAME") sbom=$(basename "$SBOM")
          sum "$name" > "$name.sha256"
          sum "$sbom" > "$sbom.sha256"
          gh release upload "$GITHUB_REF_NAME" "$name" "$name.sha256" "$sbom" "$sbom.sha256" --repo "$GITHUB_REPOSITORY"


  # The install script, with this release's version filled in, so the
  # latest release's (releases/latest/download/install.sh) installs it.
  install-script:
    needs: draft
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fill in the version
        id: script
        run: |
          version=${GITHUB_REF_NAME#v}
          sed "s/^release_version=''\$/release_version='$version'/" scripts/install.sh > "$RUNNER_TEMP/install.sh"
          if ! grep -qx "release_version='$version'" "$RUNNER_TEMP/install.sh"; then
            echo "::error::scripts/install.sh has no release_version='' line to fill in"
            exit 1
          fi
          echo "path=$RUNNER_TEMP/install.sh" >> "$GITHUB_OUTPUT"
      - name: Attest where it was built
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.script.outputs.path }}
      - name: Attach it, with its checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP"
          sha256sum install.sh > install.sh.sha256
          gh release upload "$GITHUB_REF_NAME" install.sh install.sh.sha256 --repo "$GITHUB_REPOSITORY"

  image:
    needs: draft
    if: ${{ !failure() && !cancelled() }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Sign in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: The image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sonda" >> "$GITHUB_ENV"
      # Pushed by digest only: nothing names it until both architectures pass.
      # On a pull request it's built and kept locally, not pushed.
      - name: Build
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: ${{ github.event_name == 'push' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) || 'type=docker' }}
          tags: ${{ github.event_name == 'push' && env.IMAGE || 'sonda-server:test' }}
          # Attestations are attached to the merged tag, not to each
          # architecture's image, so the merge stays a plain two-image index.
          provenance: false
          sbom: false
      - name: It runs and reports the version
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "$GITHUB_EVENT_NAME" = push ]; then ref="$IMAGE@$DIGEST"; else ref=sonda-server:test; fi
          if ! docker run --rm "$ref" --version | grep -qw -- "$version"; then
            echo "::error::the image doesn't report version $version"
            exit 1
          fi
      - name: Keep the digest
        if: github.event_name == 'push'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir digests
          echo "$DIGEST" > "digests/${PLATFORM//\//-}"
      - name: Hand it to the merge
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ strategy.job-index }}
          path: digests/*
          if-no-files-found: error

  # One tag for both architectures, and its digest in the release notes.
  image-tag:
    # The CLI too: the image's SBOM is made with the x86_64 binary the cli
    # job attaches to the draft.
    needs: [image, cli]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Tag both, say so in the notes
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sonda"
          version=${GITHUB_REF_NAME#v}
          [ "$(ls digests | wc -l)" -eq 2 ] || { echo "::error::expected a digest per architecture"; ls digests; exit 1; }
          # shellcheck disable=SC2046
          docker buildx imagetools create -t "$image:$version" $(for f in digests/*; do echo "$image@$(cat "$f")"; done)
          digest=$(docker buildx imagetools inspect "$image:$version" --format '{{.Manifest.Digest}}')
          # The tag must hold both architectures.
          docker buildx imagetools inspect "$image:$version" | grep -c 'Platform:' | grep -qx 2
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$RUNNER_TEMP/notes.md"
          {
            printf '\n### Server image\n\n'
            printf 'The server, for linux/amd64 and linux/arm64. Pin it by digest:\n\n'
            printf '```\n%s@%s\n```\n' "$image" "$digest"
          } >> "$RUNNER_TEMP/notes.md"
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/notes.md"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: The image's SBOM, from the lockfiles it was built from
        id: sbom
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern "sonda-$version-x86_64-linux" --dir "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/sonda-$version-x86_64-linux"
          # The server's crates and the web app's packages.
          mkdir -p "$RUNNER_TEMP/locks/web"
          cp Cargo.lock "$RUNNER_TEMP/locks/"
          cp web/pnpm-lock.yaml web/package.json "$RUNNER_TEMP/locks/web/"
          "$RUNNER_TEMP/sonda-$version-x86_64-linux" sbom "$RUNNER_TEMP/locks" --output "sonda-$version-image.cdx.json"
          echo "path=sonda-$version-image.cdx.json" >> "$GITHUB_OUTPUT"
          sha256sum "sonda-$version-image.cdx.json" > "sonda-$version-image.cdx.json.sha256"
          gh release upload "$GITHUB_REF_NAME" "sonda-$version-image.cdx.json" "sonda-$version-image.cdx.json.sha256" --repo "$GITHUB_REPOSITORY"
      - name: Attest where it was built
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.tag.outputs.name }}
          subject-digest: ${{ steps.tag.outputs.digest }}
          push-to-registry: true
      - name: Attest its SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ steps.tag.outputs.name }}
          subject-digest: ${{ steps.tag.outputs.digest }}
          sbom-path: ${{ steps.sbom.outputs.path }}
          push-to-registry: true

  publish:
    needs: [cli, cli-native, install-script, image-tag]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checksums in one file, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern '*.sha256' --dir sums
          cat sums/*.sha256 > SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS --repo "$GITHUB_REPOSITORY"
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false

  # The published script, as the docs run it, installs this release on each
  # platform with a binary but Windows. A failure here comes after
  # publishing: fix the script and release again.
  try-install:
    needs: publish
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      attestations: read
    steps:
      - name: It installs this release, checked
        env:
          # So the script verifies the attestation too.
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/install.sh" |
            sh -s -- --dir "$RUNNER_TEMP/bin" 2> "$RUNNER_TEMP/log" || { cat "$RUNNER_TEMP/log"; exit 1; }
          cat "$RUNNER_TEMP/log"
          grep -q "attestation OK" "$RUNNER_TEMP/log"
          "$RUNNER_TEMP/bin/sonda" --version | grep -qw -- "${GITHUB_REF_NAME#v}"
