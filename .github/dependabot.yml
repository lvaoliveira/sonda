version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # tree-sitter and its grammars parse untrusted input: review their
    # updates as security-relevant (see docs/engineering-standards.md §8).
    groups:
      tree-sitter:
        patterns: ["tree-sitter*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
  # Base images in Dockerfile and compose.yaml, pinned by digest.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
