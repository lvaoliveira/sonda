[package]
name = "sonda-netref"
version = "0.0.0"
publish = false
edition = "2024"
description = "Extracts the .NET reference packs' public declarations for sonda (ADR-0022)."

[dependencies]
cildec = "0.1.0"
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Its own workspace: a development tool, outside the shipped crates and
# their dependency policy (ADR-0022).
[workspace]
members = ["."]
