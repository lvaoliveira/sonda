[workspace]
members = ["crates/sonda-core", "crates/sonda"]
resolver = "3"

# Shared by every crate, so versions and metadata cannot drift apart.
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lvaoliveira/sonda"

[workspace.dependencies]
sonda-core = { path = "crates/sonda-core", version = "0.1.0" }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
ignore = "0.4.34"
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
rayon = "1.12.0"
rustix = { version = "1.1.6", features = ["fs", "process"] }
seccompiler = { version = "0.5.0", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = { version = "0.11.1", default-features = false }
similar = "3.2.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.1.8"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "env-filter"] }
tree-sitter = "0.27.1"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-typescript = "0.23.2"
# 3.4.3 and 3.5.0 were younger than the 14-day minimum when added. Cargo.lock
# also holds rustls-webpki 0.103.16 and webpki-roots 1.0.10 below that age, on
# purpose: they fix RUSTSEC-2026-0382 and RUSTSEC-2026-0381. A security fix
# overrides the minimum age.
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
