[package]
name = "sonda"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Open-source static analysis and quality gates for JavaScript/TypeScript, Python, Java and C/C++"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["static-analysis", "linter", "code-quality", "sarif", "tree-sitter"]
categories = ["command-line-utilities", "development-tools"]

[features]
# Entry points for the fuzz targets in fuzz/. Not part of the public API.
fuzzing = []

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
ignore = "0.4.34"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
similar = "3.2.1"
thiserror = "2.0.21"
toml = "1.1.8"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "env-filter"] }
tree-sitter = "0.27.1"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-typescript = "0.23.2"

[dev-dependencies]
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
tempfile = "3.27.0"

[target."cfg(unix)".dependencies]
rustix = { version = "1.1.6", features = ["fs", "process"] }

[target.'cfg(target_os = "linux")'.dependencies]
seccompiler = { version = "0.5.0", features = ["json"] }
