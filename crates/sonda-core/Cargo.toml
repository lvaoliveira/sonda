[package]
name = "sonda-core"
description = "The sonda analysis engine: parsing, rules, measures, quality gates and reports"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["static-analysis", "linter", "code-quality", "sarif", "tree-sitter"]
categories = ["development-tools"]

[features]
# Entry points for the fuzz targets in fuzz/. Not part of the public API.
fuzzing = []

[dependencies]
ignore.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
similar.workspace = true
thiserror.workspace = true
toml.workspace = true
yaml-rust2.workspace = true
tracing.workspace = true
tree-sitter.workspace = true
tree-sitter-c.workspace = true
tree-sitter-cpp.workspace = true
tree-sitter-java.workspace = true
tree-sitter-javascript.workspace = true
tree-sitter-python.workspace = true
tree-sitter-typescript.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true

[target."cfg(unix)".dependencies]
rustix.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
seccompiler.workspace = true
