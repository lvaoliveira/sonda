# sonda server + PostgreSQL (ADR-0005). See docs/server.md. Start it with
# scripts/setup-server.sh, which creates the secrets below first, or by
# hand before the first `docker compose up`:
#
#   mkdir -m 700 secrets
#   openssl rand -hex 32 > secrets/db_password
#   openssl rand -hex 32 > secrets/sonda_token
#   openssl rand -base64 18 > secrets/admin_password   # the first admin's
#   openssl rand -base64 32 > secrets/secret_key       # encrypts stored secrets
#   chmod 644 secrets/*    # readable by the containers' non-root users
name: sonda

services:
  sonda:
    build: .
    # `scripts/setup-server.sh --image ghcr.io/...@sha256:...` runs a published
    # release instead of building this checkout.
    image: ${SONDA_IMAGE:-sonda-server:local}
    # Published on this machine only; put a TLS reverse proxy in front to
    # expose it. SONDA_PORT (in .env) moves it off 9000.
    ports: ["127.0.0.1:${SONDA_PORT:-9000}:9000"]
    environment:
      DATABASE_URL: postgres://sonda@db:5432/sonda
      DATABASE_PASSWORD_FILE: /run/secrets/db_password
      SONDA_TOKEN_FILE: /run/secrets/sonda_token
      # Creates the user `admin` with this password while no users exist
      # (ADR-0006); ignored afterwards.
      SONDA_ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      # Encrypts the secrets the server stores, such as a GitHub App's key
      # (ADR-0024). Keep it with the database's backups: they need it.
      SONDA_SECRET_KEY_FILE: /run/secrets/secret_key
    secrets: [db_password, sonda_token, admin_password, secret_key]
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  db:
    image: postgres:17@sha256:3b0cda93be7c8dba2ed484d19393d93845dc3dafb88973e248ba8e6d99d784e1
    environment:
      POSTGRES_USER: sonda
      POSTGRES_DB: sonda
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "sonda", "-d", "sonda"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    # No ports: the database is reachable only on the compose network.

secrets:
  db_password:
    file: ./secrets/db_password
  sonda_token:
    file: ./secrets/sonda_token
  admin_password:
    file: ./secrets/admin_password
  secret_key:
    file: ./secrets/secret_key

volumes:
  pgdata:
