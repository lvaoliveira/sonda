# SonarQube on sonda's own code (.github/workflows/self-analysis.yml), to
# compare with sonda's analysis of the same commit. CONTRIBUTING.md,
# "Self-analysis", has the setup.
sonar.projectKey=sonda
sonar.projectName=sonda

sonar.sources=crates,web/src,scripts
sonar.tests=crates,web/src
# Rust's integration tests and the web app's test files, mock and setup
# are tests; everything else under those directories is code.
sonar.test.inclusions=crates/*/tests/**,web/src/**/*.test.ts,web/src/**/*.test.tsx,web/src/test/**,web/src/api/mock/**
sonar.exclusions=crates/*/tests/**,web/src/**/*.test.ts,web/src/**/*.test.tsx,web/src/test/**,web/src/api/mock/**,**/node_modules/**,**/target/**

# The workspace's Cargo.toml, at the root, is the default manifest.
# Rust coverage comes from CI, as an argument the workflow adds.
sonar.javascript.lcov.reportPaths=web/coverage/lcov.info
